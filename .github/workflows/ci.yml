name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: House style
        run: python tools/check_copy.py
      - name: Lint
        run: ruff check src tests tools
      - name: Tests
        # Six tests drive a real model or stand up real A2A servers, so they need credentials this
        # workflow does not have. They are marked `aws` and deselected here rather than made to pass
        # against a fake. The other 124 are deterministic and run on every push.
        run: pytest -q -m "not aws"

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium
      - name: Generate the scenario
        run: python -m turnout.data.generate
      - name: Serve
        run: |
          uvicorn turnout.api.app:app --port 8000 --log-level warning &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
      - name: axe-core, layout and target sizes
        # Every page, both themes, three widths. Fails the build on any WCAG 2.2 AA violation,
        # any sideways scroll, any undersized target, or any console error.
        run: python tools/a11y_audit.py --base http://127.0.0.1:8000
